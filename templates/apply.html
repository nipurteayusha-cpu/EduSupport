<!DOCTYPE html>
<html>

<head>

    <title>EduSupport - Apply for Support</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .apply-container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .apply-box {
            background: white;
            width: 600px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }

        .apply-box h1 {
            text-align: center;
            color: #173b6c;
            margin-bottom: 10px;
        }

        .apply-box .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .apply-box label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .apply-box input,
        .apply-box textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .apply-box textarea {
            resize: vertical;
        }

        .apply-box button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #198754;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .apply-box button:hover {
            background: #146c43;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #173b6c;
            text-decoration: none;
        }

    </style>

</head>

<body>

<nav class="navbar">

    <div class="logo">
        EduSupport
    </div>

    <div class="nav-links">

        <a href="/">Home</a>
        <a href="/student">Dashboard</a>
        <a href="/student-requests">My Applications</a>

    </div>

</nav>


<div class="apply-container">

    <div class="apply-box">

        <h1>Education Support Application</h1>

        <p class="subtitle">
            Tell us about your educational support requirements.
        </p>

        <form method="POST">

            <label>Student Name</label>

            <input
                type="text"
                name="student_name"
                placeholder="Enter your full name"
                required
            >


            <label>Course</label>

            <input
                type="text"
                name="course"
                placeholder="Example: BSc IT"
                required
            >


            <label>College</label>

            <input
                type="text"
                name="college"
                placeholder="Enter your college name"
                required
            >


            <label>Required Amount</label>

            <input
                type="number"
                name="amount"
                placeholder="Enter required amount"
                min="1"
                required
            >


            <label>Why do you need support?</label>

            <textarea
                name="reason"
                rows="5"
                placeholder="Explain your educational requirement..."
                required
            ></textarea>


            <button type="submit">
                Submit Application
            </button>

        </form>


        <a href="/student" class="back-link">
            ← Back to Student Dashboard
        </a>

    </div>

</div>


<footer class="footer">

    <p>
        © 2026 EduSupport | Educational Support Platform
    </p>

</footer>

</body>

</html>
