<!DOCTYPE html>
<html>

<head>

    <title>EduSupport - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .login-container {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }

        .login-box h1 {
            text-align: center;
            color: #173b6c;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .login-box label {
            font-weight: bold;
            display: block;
            margin-bottom: 7px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 18px;
        }

        .login-box button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #173b6c;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #0f2c52;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #173b6c;
            text-decoration: none;
        }

    </style>

</head>

<body>

<nav class="navbar">

    <div class="logo">
        EduSupport
    </div>

    <div class="nav-links">

        <a href="/">Home</a>
        <a href="/register">Register</a>
        <a href="/login">Login</a>
        <a href="/admin-login">Admin</a>

    </div>

</nav>


<div class="login-container">

    <div class="login-box">

        <h1>Welcome Back</h1>

        <p>Login to your EduSupport account</p>

        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </div>

</div>


<footer class="footer">

    <p>
        © 2026 EduSupport | Educational Support Platform
    </p>

</footer>

</body>

</html>
