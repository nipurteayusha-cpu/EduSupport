<!DOCTYPE html>
<html>

<head>

    <title>EduSupport - Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .register-container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-box {
            background: white;
            width: 420px;
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }

        .register-box h1 {
            text-align: center;
            color: #173b6c;
            margin-bottom: 8px;
        }

        .register-box p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .register-box label {
            font-weight: bold;
            display: block;
            margin-bottom: 7px;
        }

        .register-box input,
        .register-box select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        .register-box button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #173b6c;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .register-box button:hover {
            background: #0f2c52;
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #173b6c;
            text-decoration: none;
        }

    </style>

</head>

<body>

<nav class="navbar">

    <div class="logo">
        EduSupport
    </div>

    <div class="nav-links">

        <a href="/">Home</a>
        <a href="/register">Register</a>
        <a href="/login">Login</a>
        <a href="/admin-login">Admin</a>

    </div>

</nav>


<div class="register-container">

    <div class="register-box">

        <h1>Create Account</h1>

        <p>Join the EduSupport community</p>

        <form method="POST">

            <label>Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <label>Register as</label>

            <select name="user_type" required>

                <option value="">Select account type</option>
                <option value="student">Student</option>
                <option value="supporter">Supporter</option>

            </select>

            <button type="submit">
                Create Account
            </button>

        </form>

        <a href="/login" class="login-link">
            Already have an account? Login
        </a>

    </div>

</div>


<footer class="footer">

    <p>
        © 2026 EduSupport | Educational Support Platform
    </p>

</footer>

</body>

</html>
